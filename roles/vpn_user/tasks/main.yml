---
- name: Ensure vpn group exists
  ansible.builtin.group:
    name: "{{ vpn_system_group }}"
    state: present

- name: Ensure vpn user exists with sudo access
  ansible.builtin.user:
    name: "{{ vpn_system_user }}"
    group: "{{ vpn_system_group }}"
    shell: "{{ vpn_system_shell }}"
    create_home: true
    groups: sudo
    append: true
    state: present

- name: Check local ED25519 key
  ansible.builtin.stat:
    path: "~/.ssh/id_ed25519.pub"
  register: vpn_user_ed25519_key
  delegate_to: localhost
  become: false

- name: Check local RSA key
  ansible.builtin.stat:
    path: "~/.ssh/id_rsa.pub"
  register: vpn_user_rsa_key
  delegate_to: localhost
  become: false

- name: Fail if no SSH public key is available
  ansible.builtin.fail:
    msg: "No SSH key found on control node (~/.ssh/id_ed25519.pub or ~/.ssh/id_rsa.pub)."
  when: not vpn_user_ed25519_key.stat.exists and not vpn_user_rsa_key.stat.exists

- name: Select public key path
  ansible.builtin.set_fact:
    vpn_user_pubkey_path: "{{ '~/.ssh/id_ed25519.pub' if vpn_user_ed25519_key.stat.exists else '~/.ssh/id_rsa.pub' }}"

- name: Ensure .ssh directory exists for vpn user
  ansible.builtin.file:
    path: "/home/{{ vpn_system_user }}/.ssh"
    state: directory
    owner: "{{ vpn_system_user }}"
    group: "{{ vpn_system_group }}"
    mode: "0700"

- name: Ensure authorized_keys exists for vpn user
  ansible.builtin.lineinfile:
    path: "/home/{{ vpn_system_user }}/.ssh/authorized_keys"
    line: "{{ lookup('file', vpn_user_pubkey_path) }}"
    create: true
    owner: "{{ vpn_system_user }}"
    group: "{{ vpn_system_group }}"
    mode: "0600"

- name: Configure passwordless sudo for vpn user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ vpn_system_user }}"
    content: "{{ vpn_system_user }} ALL=(ALL) {{ 'NOPASSWD:' if vpn_system_sudo_nopasswd else '' }}ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: Check if docker group exists
  ansible.builtin.getent:
    database: group
    key: docker
  register: vpn_user_docker_group
  failed_when: false
  changed_when: false

- name: Add vpn user to docker group when available
  ansible.builtin.user:
    name: "{{ vpn_system_user }}"
    groups: docker
    append: true
  when:
    - vpn_user_docker_group.ansible_facts is defined
    - vpn_user_docker_group.ansible_facts.getent_group is defined
    - "'docker' in vpn_user_docker_group.ansible_facts.getent_group"
