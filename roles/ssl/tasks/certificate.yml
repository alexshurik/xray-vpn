---
# Certificate acquisition using standalone mode (no web server running yet)
# Source: https://eff-certbot.readthedocs.io/en/stable/using.html

- name: Obtain SSL certificate via standalone mode
  ansible.builtin.command:
    cmd: >
      certbot certonly
      --standalone
      --noninteractive
      --agree-tos
      --email {{ email }}
      --domain {{ domain }}
      --preferred-challenges http
    creates: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
  register: certbot_result

- name: Verify certificate was obtained
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
  register: cert_file

- name: Fail if certificate not found
  ansible.builtin.fail:
    msg: "Certificate was not created at /etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  when: not cert_file.stat.exists

- name: Validate certificate is not expired
  ansible.builtin.command: >
    openssl x509 -checkend 0 -noout -in /etc/letsencrypt/live/{{ domain }}/fullchain.pem
  register: cert_validity_check
  changed_when: false
  failed_when: cert_validity_check.rc != 0
