---
# SSH hardening settings
ssh_port: 22
hardening_ssh_test_user: "{{ vpn_system_user | default(ansible_user) }}"

# Fail2ban settings (for 06-02)
fail2ban_bantime: 3600
fail2ban_findtime: 600
fail2ban_maxretry: 5

# Watchtower settings (for 06-03)
watchtower_poll_interval: 86400
# true = only update containers labelled com.centurylinklabs.watchtower.enable=true
# (3x-ui is labelled by the vpn role). Use it when the host also runs services
# deployed by other tooling (e.g. CI) that Watchtower must not restart.
watchtower_label_enable: false
