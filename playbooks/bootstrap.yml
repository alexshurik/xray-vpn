---
# Bootstrap playbook: SSH key deployment and initial configuration
# Run with: ansible-playbook --ask-pass playbooks/bootstrap.yml
#
# This playbook:
# 1. Prompts for VPS connection details (IP, user, password, domain, email)
# 2. Connects to VPS using password authentication
# 3. Deploys SSH public key for passwordless access
# 4. Updates inventory with VPS details
# 5. Stores sensitive values in Ansible Vault

- name: Collect deployment variables
  hosts: localhost
  gather_facts: false
  connection: local

  vars_prompt:
    - name: target_host
      prompt: "Enter VPS IP address"
      private: false

    - name: ssh_user
      prompt: "Enter SSH username"
      private: false
      default: "root"

    - name: ssh_password
      prompt: "Enter SSH password"
      private: true
      unsafe: true  # Allow special characters in password

    - name: domain
      prompt: "Enter domain name (e.g., vpn.example.com)"
      private: false

    - name: email
      prompt: "Enter email for SSL certificates"
      private: false

  tasks:
    - name: Display collected variables (excluding password)
      ansible.builtin.debug:
        msg: |
          Target: {{ target_host }}
          User: {{ ssh_user }}
          Domain: {{ domain }}
          Email: {{ email }}

    - name: Ensure local .ssh directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') + '/.ssh' }}"
        state: directory
        mode: "0700"

    - name: Fetch SSH host key from target
      ansible.builtin.command: "ssh-keyscan -T 5 -H {{ target_host }}"
      register: bootstrap_hostkey_scan
      changed_when: false
      failed_when: false

    - name: Preload SSH host key on control node
      ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') + '/.ssh/known_hosts' }}"
        name: "{{ target_host }}"
        key: "{{ item }}"
        state: present
      loop: "{{ bootstrap_hostkey_scan.stdout_lines | default([]) }}"
      when: item | length > 0

    - name: Add target host to in-memory inventory
      ansible.builtin.add_host:
        name: vps
        groups: vpn_servers
        ansible_host: "{{ target_host }}"
        ansible_user: "{{ ssh_user }}"
        ansible_password: "{{ ssh_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
        # Pass variables to next play
        vps_domain: "{{ domain }}"
        vps_email: "{{ email }}"
        vps_ssh_password: "{{ ssh_password }}"

- name: Deploy SSH key to VPS
  hosts: vpn_servers
  gather_facts: false
  become: true

  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Create .ssh directory for user
      ansible.builtin.file:
        path: "{{ '/root/.ssh' if ansible_user == 'root' else '/home/' + ansible_user + '/.ssh' }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Check for existing SSH public key on control node
      ansible.builtin.stat:
        path: "~/.ssh/id_rsa.pub"
      delegate_to: localhost
      become: false
      register: rsa_key

    - name: Check for ED25519 key on control node
      ansible.builtin.stat:
        path: "~/.ssh/id_ed25519.pub"
      delegate_to: localhost
      become: false
      register: ed25519_key

    - name: Fail if no SSH key found
      ansible.builtin.fail:
        msg: |
          No SSH public key found on control node.
          Please generate one with: ssh-keygen -t ed25519 -C "vpn-deployment"
      when: not rsa_key.stat.exists and not ed25519_key.stat.exists

    - name: Set SSH key path (prefer ED25519)
      ansible.builtin.set_fact:
        ssh_pubkey_path: "{{ '~/.ssh/id_ed25519.pub' if ed25519_key.stat.exists else '~/.ssh/id_rsa.pub' }}"

    - name: Ensure authorized_keys contains control node key
      ansible.builtin.lineinfile:
        path: "{{ '/root/.ssh/authorized_keys' if ansible_user == 'root' else '/home/' + ansible_user + '/.ssh/authorized_keys' }}"
        line: "{{ lookup('file', ssh_pubkey_path) }}"
        create: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Test key-based SSH connection
      ansible.builtin.command:
        cmd: ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new {{ ansible_user }}@{{ ansible_host }} echo "Key auth works"
      delegate_to: localhost
      become: false
      register: key_test
      changed_when: false
      failed_when: false

    - name: Confirm SSH key deployment
      ansible.builtin.debug:
        msg: "SUCCESS: SSH key deployed. Passwordless authentication is now available."
      when: key_test.rc == 0

    - name: Warn if key test failed
      ansible.builtin.debug:
        msg: "WARNING: Key test returned non-zero. Check SSH configuration."
      when: key_test.rc != 0

- name: Update local configuration
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Get VPS variables from in-memory inventory
      ansible.builtin.set_fact:
        vps_host: "{{ hostvars['vps']['ansible_host'] }}"
        vps_user: "{{ hostvars['vps']['ansible_user'] }}"
        vps_domain: "{{ hostvars['vps']['vps_domain'] }}"
        vps_email: "{{ hostvars['vps']['vps_email'] }}"
        vps_password: "{{ hostvars['vps']['vps_ssh_password'] }}"

    - name: Update inventory file with VPS details
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../inventory/hosts.yml"
        content: |
          ---
          all:
            children:
              vpn_servers:
                hosts:
                  vps:
                    ansible_host: {{ vps_host }}
                    ansible_user: {{ vps_user }}
        mode: '0644'

    - name: Update group_vars with non-sensitive values
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../group_vars/all/vars.yml"
        content: |
          ---
          # Variable indirection pattern - references vault-protected values
          # Actual secrets are in vault.yml (encrypted)

          # SSH configuration
          ssh_key_type: ed25519
          ssh_key_comment: "vpn-deployment-key"

          # Reference to vault-protected password (used only during bootstrap)
          ssh_password: "{{ '{{' }} vault_ssh_password {{ '}}' }}"

          # Domain and email (set by bootstrap playbook)
          domain: "{{ vps_domain }}"
          email: "{{ vps_email }}"

          # Monitoring stack deployment toggle for playbooks/deploy.yml
          monitoring_enabled: false

          # Security monitoring toggle for playbooks/deploy.yml
          # Requires monitoring_enabled=true
          security_monitoring_enabled: false
        mode: '0644'

    - name: Check whether vault file already exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../group_vars/all/vault.yml"
      register: bootstrap_vault_file

    - name: Create vault file with secrets (initial bootstrap only)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../group_vars/all/vault.yml"
        content: |
          ---
          # ENCRYPT THIS FILE: ansible-vault encrypt group_vars/all/vault.yml
          # This file contains sensitive values collected during bootstrap

          vault_ssh_password: "{{ vps_password }}"
          vault_vpn_admin_password: "CHANGE_ME"
          vault_grafana_admin_password: "CHANGE_ME"
        mode: '0600'
      register: bootstrap_vault_create
      when: not bootstrap_vault_file.stat.exists

    - name: Preserve existing vault file
      ansible.builtin.debug:
        msg: "Existing group_vars/all/vault.yml preserved (not overwritten by bootstrap)."
      when: bootstrap_vault_file.stat.exists

    - name: Display next steps
      ansible.builtin.debug:
        msg: |
          ================================================
          BOOTSTRAP COMPLETE
          ================================================

          SSH key deployed to {{ vps_host }}

          Next steps:
          {% if bootstrap_vault_create is defined and bootstrap_vault_create.changed %}
          1. Edit initial secrets in group_vars/all/vault.yml:
             vault_vpn_admin_password / vault_grafana_admin_password

          2. Encrypt the vault file:
             ansible-vault encrypt group_vars/all/vault.yml
          {% else %}
          1. Existing vault.yml was preserved (no overwrite).
             Ensure vault_vpn_admin_password and vault_grafana_admin_password are set.
          {% endif %}

          3. Test passwordless connection:
             ssh {{ vps_user }}@{{ vps_host }}

          4. Proceed with deployment:
             ansible-playbook playbooks/deploy.yml --ask-vault-pass

          ================================================
